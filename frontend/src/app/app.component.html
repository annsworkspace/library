

<header>
  <a class="brand" routerLink="/" aria-label="Library home"><span class="brand-name">Snoopy's Library</span></a>
  <p class="header-note">Keep your everyday books here!</p>
  <nav class="header-actions" aria-label="Main navigation">
    <a class="header-icon-button" routerLink="/account" aria-label="Profile" title="Profile">♙</a>
    <a class="header-icon-button" routerLink="/add" aria-label="Add a book" title="Add a book">+</a>
    <a *ngIf="!authService.isLoggedIn()" routerLink="/login">Log in</a>
    <button *ngIf="authService.isLoggedIn()" type="button" (click)="logout()">
      Log out
    </button>
  </nav>
</header>

<router-outlet></router-outlet>

<footer class="site-footer">
  <div class="site-footer-inner">
    <div>
      <a class="footer-brand" routerLink="/"><span class="brand-name">Snoopy's Library</span></a>
      <p class="footer-copy">A cozy home for your books.</p>
      <nav class="footer-links" aria-label="Find us online">
        <a href="mailto:hello@snoopyslibrary.example">Email</a>
        <a href="https://example.com/snoopyslibrary-facebook" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a href="https://example.com/snoopyslibrary-instagram" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a *ngIf="authService.isAdmin()" routerLink="/admin/categories"> Manage categories </a>
        <a *ngIf="authService.isAdmin()" routerLink="/admin/authors">Manage authors</a>
      </nav>
    </div>
    <p class="footer-rights">© {{ currentYear }} Snoopy's Library. All rights reserved.</p>
  </div>
</footer>
