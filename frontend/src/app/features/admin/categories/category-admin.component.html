<main>
  <section class="page-card">
    <div class="page-card-body">
      <h1>Manage categories</h1>
      <p class="lead">Add or rename categories for the library.</p>

      <form (ngSubmit)="saveCategory()" #categoryForm="ngForm">
        <div class="form-field">
          <label for="categoryName">Category name</label>
          <input
            id="categoryName"
            name="categoryName"
            [(ngModel)]="categoryName"
            required
            maxlength="80">
        </div>

        <div class="book-actions">
          <button type="submit" class="btn" [disabled]="categoryForm.invalid || isSaving">
            {{ isSaving ? 'Saving…' : (editingId === null ? 'Add category' : 'Save category') }}
          </button>
          <button
            *ngIf="editingId !== null"
            type="button"
            class="btn"
            (click)="cancelEdit()">
            Cancel
          </button>
        </div>
      </form>

      <p *ngIf="errorMessage" class="form-message" role="alert">
        {{ errorMessage }}
      </p>

      <p *ngIf="isLoading" role="status">Loading categories…</p>

      <ul *ngIf="!isLoading && categories.length" class="category-list">
        <li *ngFor="let category of categories">
          <span>{{ category.name }}</span>
          <div class="book-actions">
            <button type="button" class="btn" (click)="editCategory(category)">
              Rename
            </button>
            <button type="button" class="btn" (click)="deleteCategory(category)">
              Delete
            </button>
          </div>
        </li>
      </ul>

      <p *ngIf="!isLoading && categories.length === 0">
        No categories yet. Add one above.
      </p>
    </div>
  </section>
</main>
