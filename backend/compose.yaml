services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estante
      POSTGRES_USER: estante
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estante -d estante"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      UPLOAD_DIR: /app/uploads/covers
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://database:5432/estante
      DATABASE_USERNAME: estante
      DATABASE_PASSWORD: local_dev_password
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      database:
        condition: service_healthy
    volumes:
    - book_covers:/app/uploads/covers 

volumes:
  postgres_data:
  book_covers:
