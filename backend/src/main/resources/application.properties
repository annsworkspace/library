spring.application.name=estante-api
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/estante}
spring.datasource.username=${DATABASE_USERNAME:estante}
spring.datasource.password=${DATABASE_PASSWORD:local_dev_password}
spring.jpa.hibernate.ddl-auto=validate
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
#defaults to uploads/covers directory
app.upload-dir=${UPLOAD_DIR:uploads/covers}

# setting file size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.jwt.secret=${APP_JWT_SECRET}